[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egeyuma"
version = "0.1.0"
description = "Evaluation tooling for Sinhala, Singlish, and Sri Lankan-context LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Dishan Rajapaksha" }
]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13,<15"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2"
]
inspect = [
  "inspect-ai>=0.3"
]
openai = [
  "openai>=1.0"
]

[project.scripts]
sinhalaeval = "egeyuma.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["egeyuma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
