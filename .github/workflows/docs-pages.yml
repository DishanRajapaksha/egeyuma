name: Publish docs and benchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs-pages.yml"
      - "docs-site/**"
      - "dashboard/**"
      - "engine/docs/**"
      - "dashboard/docs/**"
      - "results/published/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build combined Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            docs-site/package-lock.json
            dashboard/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install docs dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build docs site
        working-directory: docs-site
        run: npm run build

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build benchmark dashboard
        working-directory: dashboard
        env:
          BASE_PATH: /egeyuma
        run: npm run build

      - name: Compose Pages artifact
        run: |
          mkdir -p pages-build/docs
          cp -R dashboard/build/. pages-build/
          cp -R docs-site/build/. pages-build/docs/
          test -f pages-build/index.html
          test -f pages-build/docs/index.html

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-build

  deploy:
    name: Deploy combined Pages site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
